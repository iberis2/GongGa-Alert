name: Diagnose MyHome Connectivity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run diagnostics
        run: pnpm diagnose:myhome

      - name: Upload diagnostics artifact
        uses: actions/upload-artifact@v4
        with:
          name: myhome-diagnostics-${{ matrix.os }}
          path: diagnostics/*.json
